[package]
name = "gnarl"
version = "2.2.2"
edition = "2024"

[lib]
name = "gnarl"
path = "src/lib.rs"

[[bin]]
name = "gnarl"
path = "src/main.rs"

[dependencies]
nodejs-semver = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1.10"
reqwest = { version = "0.13", features = ["blocking"] }
which = "8.0"
chrono = "0.4.44"

[dev-dependencies]
tempfile = "3"
